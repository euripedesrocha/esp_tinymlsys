minimum_pre_commit_version: 3.3.0
default_install_hook_types: [pre-commit, commit-msg]

repos:
  - repo: local
    hooks:
      - id: clang-format
        name: clang-format
        entry: clang-format -style=file -i
        language: system
        files: \.(c|cc|cpp|cxx|h|hh|hpp|hxx)$

  - repo: https://github.com/espressif/conventional-precommit-linter
    rev: v1.11.0
    hooks:
      - id: conventional-precommit-linter
        stages: [commit-msg]
        args:
          - --types=build,ci,chore,docs,feat,fix,perf,refactor,style,test
          - --allow-breaking
